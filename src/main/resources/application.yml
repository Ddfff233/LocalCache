spring:
  application:
    name: cache
  datasource:
    url: jdbc:sqlite:./db/system.sqlite?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      # 单写入连接可减少数据库锁竞争
      maximum-pool-size: 1
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/data.sql
        - classpath:db/2026-09-30-Caffeine持久化MQ.sql


cache:
  max-size: 100000
  mq:
    ack-timeout: 30s
    recovery-interval: 1s
    dead-letter-queue: MQ_DEFAULT_DEAD_LETTER
    consumer:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 1000
    retry:
      max-attempts: 3
      initial-delay: 1s
      multiplier: 2
      max-delay: 30s
