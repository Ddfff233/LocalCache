spring:
  application:
    name: cache
  datasource:
    url: jdbc:sqlite:./db/system.sqlite?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      # 单写入连接可减少数据库锁竞争
      maximum-pool-size: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:db/data.sql


cache:
  max-size: 100000
